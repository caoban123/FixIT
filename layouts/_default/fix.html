{{ define "main" }}
<section class="section">
  <div class="wrap narrow">
    <h1>{{ .Title }}</h1>
    <p class="lead muted">{{ .Params.short }}</p>

    <div class="card pad fix-card">
      <div class="progress" aria-hidden="true"><div id="fix-bar"></div></div>
      <p id="fix-step" class="eyebrow">Bước 1/3</p>
      <div id="fix-box" aria-live="polite">Đang tải…</div>
      <noscript>Trang này cần bật JavaScript.</noscript>
    </div>

    <h2 class="mt">Máy bạn có ổn không?</h2>
    <p class="muted">Trả lời nhanh 5 câu để biết có nên kiểm tra sức khoẻ laptop.</p>
    <div class="card pad" id="quiz"></div>
  </div>
</section>
{{ end }}
{{ define "scripts" }}<script src="{{ "js/fix.js" | relURL }}"></script>{{ end }}
