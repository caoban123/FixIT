{{ define "main" }}
<section class="section">
  <div class="wrap narrow">
    <h1>{{ .Title }}</h1>
    <div class="faq">
      {{ range .Params.faq }}
      <details class="card pad">
        <summary>{{ .q }}</summary>
        <p>{{ .a }}</p>
      </details>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
