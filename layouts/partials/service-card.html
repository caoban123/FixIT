{{ $p := . }}
<article class="card service-card"
  data-cat="{{ $p.Params.category }}"
  data-price="{{ $p.Params.price }}"
  data-name="{{ $p.Title | lower }}"
  data-tags="{{ delimit $p.Params.tags " " | lower }}">
  <a class="card-img" href="{{ $p.RelPermalink }}" aria-label="Xem chi tiết dịch vụ {{ $p.Title }}">
    <img src="{{ $p.Params.image | relURL }}" alt="Minh hoạ dịch vụ {{ $p.Title }}" loading="lazy" width="640" height="400">
    <span class="chip cat-{{ $p.Params.category }}">{{ $p.Params.category | title }}</span>
  </a>
  <div class="card-body">
    <h3 class="service-card-title"><a href="{{ $p.RelPermalink }}">{{ $p.Params.icon }} {{ $p.Title }}</a></h3>
    <p class="service-card-desc">{{ $p.Params.short }}</p>
    <div class="card-meta">
      <div class="price-wrap">
        <span class="price-sub">TRỌN GÓI</span>
        <span class="price">{{ $p.Params.price | lang.FormatNumber 0 }}đ</span>
      </div>
      <span class="duration-pill">⏱ {{ $p.Params.duration }}</span>
    </div>
    <div class="card-actions">
      <a class="btn btn-ghost btn-sm" href="{{ $p.RelPermalink }}">Chi tiết →</a>
      <button class="btn btn-primary btn-sm add-to-cart" type="button"
        data-id="{{ $p.Params.id }}" data-name="{{ $p.Title }}" data-price="{{ $p.Params.price }}"
        aria-label="Thêm dịch vụ {{ $p.Title }} vào giỏ hàng">
        <span>🛒 Thêm giỏ</span>
      </button>
    </div>
  </div>
</article>
