{{- $slug := .File.ContentBaseName -}}
<article class="card card--link reveal" data-service data-group="{{ .Params.group }}" data-price="{{ .Params.price }}" data-weight="{{ .Weight }}">
  {{ partial "service-figure.html" (dict "page" . "wide" false) }}
  <p class="card-meta"><span class="tag">{{ .Params.groupLabel }}</span> <span>{{ .Params.duration }}</span></p>
  <h3 class="card-title"><a class="card-link" href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p class="card-text">{{ .Params.summary }}</p>
  <div class="card-foot">
    <p class="card-price">{{ partial "price.html" . }}</p>
    <div class="card-actions">
      <a class="btn btn--secondary btn--small" href="{{ .RelPermalink }}">Chi tiết</a>
      <button class="btn btn--primary btn--small" type="button" data-add-to-cart data-id="{{ $slug }}" data-title="{{ .Title }}" data-price="{{ .Params.price }}">Thêm giỏ</button>
    </div>
  </div>
</article>
