ai:
  title: "Chúng mình dùng AI như thế nào"
  intro: "Nhóm công khai việc có dùng AI hỗ trợ trong quá trình làm sản phẩm này, cho các việc sau:"
  items:
    - "Brainstorm ý tưởng và tên gọi"
    - "Viết và chỉnh sửa nội dung"
    - "Gợi ý concept hình ảnh"
    - "Sắp xếp cấu trúc nội dung"
    - "Kiểm thử luồng người dùng"
  closing: "Mọi nội dung và mã nguồn có AI hỗ trợ đều được thành viên đọc, kiểm thử và hiểu rõ trước khi đưa vào sản phẩm."
