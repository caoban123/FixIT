# Nội dung trang About, theo cấu trúc trang gốc.
# Ảnh đặt trong static/images/team/ (đuôi jpg, jpeg, png hoặc webp):
#   - nhom.jpg : ảnh cả nhóm
#   - <id>.jpg : ảnh từng thành viên, <id> trùng với trường `id` bên dưới (a, b, c, d, e)
# Chỗ trong dấu [ ] là chỗ mẫu, hãy thay bằng thông tin thật của nhóm.

story:
  title: "Câu chuyện của nhóm"
  groupAlt: "Ảnh cả nhóm FixIT Student"
  paragraphs:
    - "Các thành viên của nhóm đều là sinh viên IT. Chúng mình từng mất rất nhiều thời gian để xử lý lỗi cài đặt, và lỗi luôn xuất hiện đúng lúc deadline đang đến gần."
    - "FixIT Student ra đời từ trải nghiệm đó: một nơi để sinh viên nhờ bạn cùng trường xử lý nhanh những lỗi công nghệ quen thuộc."

mission:
  title: "Sứ mệnh"
  text: "Giúp sinh viên xử lý sự cố công nghệ nhanh, dễ hiểu và với giá sinh viên, để tập trung vào việc học."
  values:
    - title: "Nhanh chóng"
      text: "Xử lý trong ngày, không giữ máy qua đêm."
    - title: "Dễ hiểu"
      text: "Nói rõ lỗi do đâu và đã làm gì, không dùng thuật ngữ khó."
    - title: "Đúng giá sinh viên"
      text: "Giá trọn gói, báo rõ từ đầu, bảo hành sửa lại miễn phí 7 ngày."

team:
  title: "Đội ngũ"
  note: "Phần giới thiệu cá nhân của từng thành viên sẽ được bổ sung."

